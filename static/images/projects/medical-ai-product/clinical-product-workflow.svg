<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Clinical workflow for AI-assisted brain tumor MRI review</title>
<desc id="desc">Six-step conceptual workflow from MRI and PACS access through AI analysis, lesion review, reporting, and physician judgment.</desc>
<defs><style>
.t{font-family:Inter,Arial,sans-serif;fill:#0B0F19}.m{font-family:Inter,Arial,sans-serif;fill:#667085}.b{fill:#1746E0}.line{stroke:#DDE4F0;stroke-width:2}.icon{fill:none;stroke:#1746E0;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.label{font-size:15px;font-weight:700;letter-spacing:2.2px}.h{font-size:23px;font-weight:600}.s{font-size:15px}.n{font-size:14px;font-weight:700}
</style></defs>
<rect width="1600" height="620" rx="34" fill="#FCFCFB"/>
<text x="70" y="62" class="b label">CLINICAL INTEGRATION · PHYSICIAN-LED</text>
<line x1="70" y1="88" x2="1530" y2="88" class="line"/>
<g transform="translate(70,132)">
  <path d="M180 148H245M425 148H490M670 148H735M915 148H980M1160 148H1225" stroke="#86A3E8" stroke-width="2.5" fill="none"/>
  <g fill="#1746E0"><path d="M240 143l10 5-10 5z"/><path d="M485 143l10 5-10 5z"/><path d="M730 143l10 5-10 5z"/><path d="M975 143l10 5-10 5z"/><path d="M1220 143l10 5-10 5z"/></g>
  <g transform="translate(0,0)"><rect width="180" height="300" rx="22" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#EEF3FF"/><text x="27" y="38" class="b n">01</text><g class="icon" transform="translate(57,75)"><rect width="66" height="50" rx="7"/><path d="M15 14h36M15 25h22M15 36h30"/></g><text x="90" y="165" text-anchor="middle" class="t h">MRI / PACS</text><text x="90" y="196" text-anchor="middle" class="m s">Clinical imaging data</text><text x="90" y="222" text-anchor="middle" class="m s">and case access</text></g>
  <g transform="translate(245,0)"><rect width="180" height="300" rx="22" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#EEF3FF"/><text x="27" y="38" class="b n">02</text><g class="icon" transform="translate(58,72)"><circle cx="32" cy="28" r="23"/><path d="M32 0v10M32 46v10M4 28h10M50 28h10"/></g><text x="90" y="165" text-anchor="middle" class="t h">AI Analysis</text><text x="90" y="196" text-anchor="middle" class="m s">Candidate detection</text><text x="90" y="222" text-anchor="middle" class="m s">and lesion processing</text></g>
  <g transform="translate(490,0)"><rect width="180" height="300" rx="22" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#EEF3FF"/><text x="27" y="38" class="b n">03</text><g class="icon" transform="translate(58,70)"><rect x="3" y="5" width="60" height="54" rx="7"/><circle cx="33" cy="32" r="12"/><path d="M33 12v8M33 44v8M13 32h8M45 32h8"/></g><text x="90" y="165" text-anchor="middle" class="t h">Lesion Overlay</text><text x="90" y="196" text-anchor="middle" class="m s">Locations surfaced</text><text x="90" y="222" text-anchor="middle" class="m s">for human review</text></g>
  <g transform="translate(735,0)"><rect width="180" height="300" rx="22" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#EEF3FF"/><text x="27" y="38" class="b n">04</text><g class="icon" transform="translate(58,72)"><path d="M3 54 20 36l13 9 29-34"/><path d="M3 62h60M12 12h40"/></g><text x="90" y="165" text-anchor="middle" class="t h">Lesion Review</text><text x="90" y="196" text-anchor="middle" class="m s">Type, location and</text><text x="90" y="222" text-anchor="middle" class="m s">quantitative evidence</text></g>
  <g transform="translate(980,0)"><rect width="180" height="300" rx="22" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="#EEF3FF"/><text x="27" y="38" class="b n">05</text><g class="icon" transform="translate(60,67)"><path d="M4 0h43l13 13v56H4z"/><path d="M47 0v16h13M16 30h32M16 42h32M16 54h22"/></g><text x="90" y="165" text-anchor="middle" class="t h">Report</text><text x="90" y="196" text-anchor="middle" class="m s">Structured summary</text><text x="90" y="222" text-anchor="middle" class="m s">for review</text></g>
