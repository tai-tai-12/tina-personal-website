{{ $isZh := eq .Site.Language.Lang "zh" }}
<footer class="site-footer site-footer-v525">
  <div class="shell footer-grid footer-grid-v524 footer-grid-v525">
    <div class="footer-identity-v524 footer-identity-v525">
      <strong>Tina Tai</strong>
      <div class="footer-contact-v524 footer-contact-v525" aria-label="Contact information">
        <span class="footer-location-v525">{{ with .Site.Params.location }}{{ . }}{{ end }} · {{ if $isZh }}開放美國與台灣工作機會{{ else }}Open to U.S. &amp; Taiwan opportunities{{ end }}</span>
        <a class="footer-email-v525" href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
      </div>
    </div>
    <nav class="footer-links" aria-label="Footer links">
      <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noreferrer">LinkedIn ↗</a>
      <a href="{{ .Site.Params.resume | relURL }}" target="_blank" rel="noreferrer">Resume ↗</a>
    </nav>
  </div>
  <div class="shell footer-note">© {{ now.Year }} Tina Tai</div>
</footer>
