baseURL = "https://tai-tai-12.github.io/tina-personal-website/"
title = "Tina Tai — Product Manager | AI/ML & Analytics"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 30

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  name = "Tina Tai"
  tagline = "Product Manager | AI/ML & Analytics"
  description = "Product manager with hands-on AI/ML and analytics experience, translating user needs, technical evidence, and cross-functional trade-offs into products that work in real workflows."
  profile_image = "images/profile/tina-homepage-portrait-v530.webp"
  linkedin = "https://www.linkedin.com/in/shih-ting-tai/"
  email = "tinatai@andrew.cmu.edu"
  location = "Pittsburgh, PA, USA"
  resume = "resume/Shih-Ting_Tai_Resume.pdf"
  plannedDomain = "tinatai.com"

[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "EN"
    weight = 1
    contentDir = "content/en"
    title = "Tina Tai — Product Manager | AI/ML & Analytics"
  [languages.zh]
    languageCode = "zh-TW"
    languageName = "中文"
    weight = 2
    contentDir = "content/zh"
    title = "Tina Tai — 產品經理 | AI/ML × 數據分析"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
