<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Clinical product workflow overview</title>
<desc id="d">Editorial diagram showing imaging input, AI review, lesion evidence, and physician decision for a medical AI product.</desc>

<style>
  .bg{fill:#FBFCFE}
  .panel{fill:#FFFFFF;stroke:#D9E0EC;stroke-width:2.4}
  .soft{fill:#F4F7FB;stroke:#D9E0EC;stroke-width:1.8}
  .title{font:700 17px/1.25 Inter,Arial,sans-serif;fill:#172B4D;letter-spacing:.01em}
  .label{font:700 14px/1 Inter,Arial,sans-serif;fill:#123F72;letter-spacing:.08em}
  .meta{font:500 11.5px/1.5 Inter,Arial,sans-serif;fill:#5A6B86}
  .mini{font:600 12px/1.3 Inter,Arial,sans-serif;fill:#2E3E57}
  .chip{font:700 11px/1 Inter,Arial,sans-serif;fill:#2F4D79;letter-spacing:.06em}
  .metric{font:700 21px/1 Inter,Arial,sans-serif;fill:#102A56}
  .metricLabel{font:600 11.5px/1.3 Inter,Arial,sans-serif;fill:#677791}
  .line{stroke:#B8C3D6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .arrow{stroke:#3A67FF;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .accent{fill:#3A67FF}
  .navy{fill:#172B4D}
  .teal{fill:#E9F7F7;stroke:#B8E2E3;stroke-width:1.6}
  .teal2{fill:#1D8B97}
  .sand{fill:#F9F5ED;stroke:#E6D8BB;stroke-width:1.5}
  .pink{fill:#FAF1F4;stroke:#E9CAD4;stroke-width:1.5}
  .outline{stroke:#172B4D;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .fine{stroke:#8FA0BA;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .faint{fill:#EEF3FA}
  .muted{fill:#91A0B8}
</style>
<rect class="bg" width="1200" height="720" rx="28"/>
<text x="70" y="72" class="title" style="font-size:34px; font-weight:800;">Clinical Product Workflow for AI-assisted MRI Review</text>
<text x="70" y="105" class="meta" style="font-size:18px; font-weight:600; fill:#2C7785;">Research → product translation → validation readiness</text>
<path d="M70 126H1130" class="line"/>

<!-- top steps -->
<g transform="translate(70 155)">
  <rect width="235" height="220" rx="22" class="panel"/>
  <circle cx="34" cy="34" r="18" class="soft"/><text x="34" y="39" text-anchor="middle" class="label" style="font-size:16px;">1</text>
  <text x="68" y="40" class="title" style="font-size:21px;">Clinical imaging</text>
  <g transform="translate(26 67)">
    <rect x="0" y="18" width="92" height="76" rx="14" class="soft"/>
    <circle cx="30" cy="56" r="18" class="faint"/><path d="M17 56h26M30 43v26" class="fine"/>
    <rect x="100" y="10" width="90" height="94" rx="18" class="navy"/>
    <path d="M147 30c-18 0-32 14-32 32 0 23 14 37 32 37 18 0 31-13 31-36 0-18-13-33-31-33Z" stroke="#F7FAFF" stroke-width="3" fill="none"/>
    <circle cx="162" cy="62" r="7" class="accent"/>
    <rect x="102" y="114" width="88" height="14" rx="7" class="faint"/>
  </g>
  <rect x="25" y="168" width="185" height="28" rx="14" class="teal"/>
  <text x="118" y="187" text-anchor="middle" class="chip">PACS · MRI case access</text>
  
</g>

<path d="M312 265H342" class="arrow"/><path d="M332 255 348 265 332 275" class="arrow"/>

<g transform="translate(358 155)">
  <rect width="235" height="220" rx="22" class="panel"/>
  <circle cx="34" cy="34" r="18" class="soft"/><text x="34" y="39" text-anchor="middle" class="label" style="font-size:16px;">2</text>
  <text x="68" y="40" class="title" style="font-size:21px;">AI review</text>
  <g transform="translate(35 76)">
    <circle cx="82" cy="54" r="46" class="soft"/>
    <circle cx="82" cy="54" r="17" class="accent"/>
    <path d="M82 3v25M82 80v25M31 54h24M109 54h24M47 20l17 17M100 71l17 17M47 88l17-17M100 37l17-17" class="arrow"/>
  </g>
  <rect x="27" y="168" width="179" height="28" rx="14" class="teal"/>
  <text x="116" y="187" text-anchor="middle" class="chip">Candidate lesions + contours</text>
  
</g>

<path d="M600 265H630" class="arrow"/><path d="M620 255 636 265 620 275" class="arrow"/>

<g transform="translate(646 155)">
  <rect width="235" height="220" rx="22" class="panel"/>
  <circle cx="34" cy="34" r="18" class="soft"/><text x="34" y="39" text-anchor="middle" class="label" style="font-size:16px;">3</text>
  <text x="68" y="40" class="title" style="font-size:21px;">Lesion evidence</text>
  <g transform="translate(25 75)">
    <rect x="0" y="0" width="60" height="60" rx="14" class="soft"/>
    <path d="M16 30h28M30 16v28" class="fine"/>
    <rect x="74" y="0" width="60" height="60" rx="14" class="teal"/>
    <path d="M92 32 104 44 118 20" class="outline"/>
    <rect x="148" y="0" width="60" height="60" rx="14" class="pink"/>
    <circle cx="178" cy="30" r="15" class="outline"/>
    <path d="M171 30h14" class="outline"/>
    <rect x="0" y="74" width="208" height="42" rx="16" class="sand"/>
    <text x="104" y="100" text-anchor="middle" class="mini">Lesion-level outputs for expert review</text>
  </g>
  
</g>

<path d="M888 265H918" class="arrow"/><path d="M908 255 924 265 908 275" class="arrow"/>

<g transform="translate(934 155)">
  <rect width="196" height="220" rx="22" class="panel"/>
  <circle cx="34" cy="34" r="18" class="soft"/><text x="34" y="39" text-anchor="middle" class="label" style="font-size:16px;">4</text>
  <text x="68" y="40" class="title" style="font-size:21px;">Clinical review</text>
  <circle cx="96" cy="108" r="28" class="soft"/>
  <path d="M96 82c-13 0-22 9-22 22 0 15 9 24 22 24s22-9 22-24c0-13-9-22-22-22Z" class="outline"/>
  <path d="M61 173c5-39 17-59 35-59s30 20 35 59" class="outline"/>
  <path d="M79 173 94 188 120 157" class="arrow"/>
  <rect x="28" y="168" width="140" height="28" rx="14" class="teal"/>
  <text x="98" y="187" text-anchor="middle" class="chip">Confirm · modify · interpret</text>
  
</g>

<!-- bottom summary -->
<g transform="translate(70 480)">
  <rect width="1060" height="170" rx="24" class="panel"/>
  <text x="32" y="40" class="label">PRODUCTIZATION FOCUS</text>
  <text x="32" y="74" class="title" style="font-size:28px;">What made the research deployment-ready</text>
  <g transform="translate(32 98)">
    <rect width="222" height="46" rx="16" class="soft"/><text x="111" y="29" text-anchor="middle" class="mini">Clinical workflow alignment</text>
    <rect x="252" width="222" height="46" rx="16" class="soft"/><text x="363" y="29" text-anchor="middle" class="mini">Traceable lesion evidence</text>
    <rect x="504" width="222" height="46" rx="16" class="soft"/><text x="615" y="29" text-anchor="middle" class="mini">Validation + regulatory packaging</text>
  </g>
  <g transform="translate(780 42)">
    <rect width="236" height="92" rx="18" class="teal"/>
    <text x="26" y="32" class="chip">DELIVERY</text>
    <text x="26" y="61" class="metric">TFDA submission prep</text>
    <text x="26" y="82" class="metricLabel">2 medical centers · cross-functional coordination</text>
  </g>
</g>
</svg>