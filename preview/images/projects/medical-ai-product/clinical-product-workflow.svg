<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Clinical product workflow for AI-assisted brain tumor MRI review</title>
<desc id="desc">Seven-step workflow from PACS case access to physician review.</desc>
<defs><style>
.t{font-family:Inter,Arial,sans-serif;fill:#0B0F19}.m{fill:#667085}.b{fill:#1746E0}.n{fill:#071A46}.line{stroke:#DDE4F0;stroke-width:2}.icon{fill:none;stroke:#1746E0;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#DDE4F0;stroke-width:2}.soft{fill:#F6F8FB}.cap{font-size:18px;font-weight:600;letter-spacing:2.5px}.h{font-size:46px;font-weight:600}.sub{font-size:22px}.st{font-size:20px;font-weight:600}.ss{font-size:15px}
</style></defs>
<rect width="1600" height="820" rx="38" fill="#FCFCFB"/>
<text class="t h" x="90" y="105">Clinical Product Workflow</text><text class="m sub" x="90" y="145">Conceptual portfolio view of AI-assisted brain tumor MRI review</text>
<line class="line" x1="90" y1="185" x2="1510" y2="185"/>
<g transform="translate(90,230)">
