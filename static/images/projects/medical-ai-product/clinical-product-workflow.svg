</g>
<g transform="translate(70,500)"><rect width="1460" height="70" rx="18" fill="#F6F8FB"/><text x="32" y="43" class="m s">Conceptual portfolio view based on product documentation. AI output is assistive; final interpretation remains with qualified clinicians.</text></g>
