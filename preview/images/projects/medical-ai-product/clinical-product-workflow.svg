<g fill="#1746E0"><path d="M230 139l12 6-12 6z"/><path d="M440 139l12 6-12 6z"/><path d="M650 139l12 6-12 6z"/><path d="M860 139l12 6-12 6z"/><path d="M1070 139l12 6-12 6z"/><path d="M1280 139l12 6-12 6z"/></g>
<!-- 1 -->
