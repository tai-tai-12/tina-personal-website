<g><rect x="559" y="264" width="214" height="206" rx="16" fill="#f4f7fb" stroke="#d8e1eb"/><circle cx="666" cy="310" r="24" fill="#526681"/><text x="666" y="319" font-size="23" fill="#fff">3</text><text x="666" y="380" fill="#162944" font-size="22">RESOLVE</text><text x="666" y="413" fill="#526681" font-size="16" font-weight="normal">Nonconformity</text><text x="666" y="437" fill="#526681" font-size="16" font-weight="normal">&amp; retesting</text></g>
