<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="t d"><title id="t">Three-stage lesion-wise AI cascade</title><desc id="d">Sensitivity-oriented candidate generation, false-positive reduction, and retained-lesion five-class typing.</desc><style>.bg{fill:#fcfcfb}.card{fill:#fff;stroke:#dce4f2;stroke-width:2}.n{fill:#1746e0}.soft{fill:#eef3ff}.txt{font-family:Arial,sans-serif;fill:#0b0f19}.muted{font-family:Arial,sans-serif;fill:#667085}.line{stroke:#8aa6e8;stroke-width:3;fill:none}</style><rect class="bg" width="1400" height="560" rx="30"/><text class="muted" x="80" y="70" font-size="20" letter-spacing="3">DATA · TWO CENTERS   TASK · LESION-WISE   EVALUATION · INDEPENDENT TEST</text><line x1="80" x2="1320" y1="98" y2="98" stroke="#dce4f2" stroke-width="2"/>
<g transform="translate(90 155)"><rect class="card" width="330" height="250" rx="24"/><circle class="soft" cx="55" cy="55" r="28"/><text class="n" x="55" y="64" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">0</text><text class="txt" x="40" y="135" font-size="26" font-weight="700">Candidate generation</text><text class="muted" x="40" y="174" font-size="18">Sensitivity-oriented proposal pool</text><text class="muted" x="40" y="210" font-size="16">T1C + T2 MRI · 3D candidate masks</text></g><path class="line" d="M430 280h90"/><path class="n" d="m520 280-18-10v20z"/>
<g transform="translate(535 155)"><rect class="card" width="330" height="250" rx="24"/><circle class="soft" cx="55" cy="55" r="28"/><text class="n" x="55" y="64" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">1</text><text class="txt" x="40" y="135" font-size="26" font-weight="700">FP reduction</text><text class="muted" x="40" y="174" font-size="18">Lesion-wise candidate filtering</text><text class="muted" x="40" y="210" font-size="16">Reduce review burden while retaining TPs</text></g><path class="line" d="M875 280h90"/><path class="n" d="m965 280-18-10v20z"/>
