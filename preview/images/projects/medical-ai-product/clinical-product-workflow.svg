<!-- 2 -->
<g transform="translate(210,0)"><rect class="box" width="155" height="290" rx="22"/><circle class="b" cx="34" cy="34" r="20"/><text x="28" y="41" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#fff">2</text><g class="icon" transform="translate(49,75)"><circle cx="23" cy="22" r="15"/><path d="m34 33 18 18M0 60h58"/></g><text class="t st" text-anchor="middle" x="77.5" y="156">Search &amp; Status</text><text class="m ss" text-anchor="middle" x="77.5" y="184">Filter cases and</text><text class="m ss" text-anchor="middle" x="77.5" y="205">confirm AI state</text></g>
<!-- 3 -->
<g transform="translate(420,0)"><rect class="box" width="155" height="290" rx="22"/><circle class="b" cx="34" cy="34" r="20"/><text x="28" y="41" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#fff">3</text><g class="icon" transform="translate(48,70)"><circle cx="30" cy="30" r="26"/><path d="M15 30h30M30 15v30M9 51h42"/></g><text class="t st" text-anchor="middle" x="77.5" y="156">MRI Viewer</text><text class="m ss" text-anchor="middle" x="77.5" y="184">Navigate image</text><text class="m ss" text-anchor="middle" x="77.5" y="205">series and tools</text></g>
<!-- 4 -->
<g transform="translate(630,0)"><rect class="box" width="155" height="290" rx="22"/><circle class="b" cx="34" cy="34" r="20"/><text x="28" y="41" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#fff">4</text><g class="icon" transform="translate(48,70)"><circle cx="30" cy="30" r="26"/><circle cx="30" cy="30" r="10"/><path d="M30 0v10M30 50v10M0 30h10M50 30h10"/></g><text class="t st" text-anchor="middle" x="77.5" y="156">AI Lesion Overlay</text><text class="m ss" text-anchor="middle" x="77.5" y="184">Surface candidate</text><text class="m ss" text-anchor="middle" x="77.5" y="205">lesion locations</text></g>
<!-- 5 -->
<g transform="translate(840,0)"><rect class="box" width="155" height="290" rx="22"/><circle class="b" cx="34" cy="34" r="20"/><text x="28" y="41" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#fff">5</text><g class="icon" transform="translate(50,72)"><path d="M0 50 18 31l12 10 26-31"/><path d="M0 58h58M8 12h42"/></g><text class="t st" text-anchor="middle" x="77.5" y="156">Lesion Analysis</text><text class="m ss" text-anchor="middle" x="77.5" y="184">Classification, size,</text><text class="m ss" text-anchor="middle" x="77.5" y="205">location and volume</text></g>
<!-- 6 -->
<g transform="translate(1050,0)"><rect class="box" width="155" height="290" rx="22"/><circle class="b" cx="34" cy="34" r="20"/><text x="28" y="41" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#fff">6</text><g class="icon" transform="translate(52,70)"><path d="M5 0h38l10 10v50H5z"/><path d="M43 0v12h10M15 25h28M15 36h28M15 47h18"/></g><text class="t st" text-anchor="middle" x="77.5" y="156">Report Summary</text><text class="m ss" text-anchor="middle" x="77.5" y="184">Review AI output</text><text class="m ss" text-anchor="middle" x="77.5" y="205">in structured form</text></g>
<!-- 7 -->
<g transform="translate(1260,0)"><rect x="0" y="0" width="155" height="290" rx="22" fill="#F3F6FF" stroke="#B7C8F2" stroke-width="2"/><circle class="n" cx="34" cy="34" r="20"/><text x="28" y="41" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#fff">7</text><g class="icon" transform="translate(49,70)"><circle cx="29" cy="18" r="13"/><path d="M2 60c4-17 50-17 54 0M15 44l14 10 14-10"/></g><text class="t st" text-anchor="middle" x="77.5" y="156">Physician Review</text><text class="m ss" text-anchor="middle" x="77.5" y="184">Clinician retains</text><text class="m ss" text-anchor="middle" x="77.5" y="205">final judgment</text></g>
</g>
<g transform="translate(115,620)"><rect x="0" y="0" width="420" height="92" rx="18" fill="#F6F8FB"/><circle cx="50" cy="46" r="26" fill="#E9F0FF"/><path d="M39 46h22M50 35v22" class="icon"/><text class="t st" x="95" y="39">Supports lesion-level review</text><text class="m ss" x="95" y="64">AI output is organized for human verification.</text></g>
<g transform="translate(590,620)"><rect x="0" y="0" width="390" height="92" rx="18" fill="#F6F8FB"/><circle cx="50" cy="46" r="26" fill="#E9F0FF"/><path d="M37 49 47 59 66 35" class="icon"/><text class="t st" x="95" y="39">Fits clinical workflow</text><text class="m ss" x="95" y="64">PACS-connected review and structured reporting.</text></g>
<g transform="translate(1035,620)"><rect x="0" y="0" width="450" height="92" rx="18" fill="#F6F8FB"/><circle cx="50" cy="46" r="26" fill="#E9F0FF"/><path d="M35 56V38h30v18M43 38V28h14v10" class="icon"/><text class="t st" x="95" y="39">Assistive, not autonomous</text><text class="m ss" x="95" y="64">Final interpretation remains with qualified clinicians.</text></g>
