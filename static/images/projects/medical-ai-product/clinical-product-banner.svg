<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Clinical product workflow</title><desc id="d">PACS imaging, AI lesion review, structured report, and physician review.</desc><style>
.bg{fill:#FBFCFE}.panel{fill:#fff;stroke:#D6DDEA;stroke-width:2}.soft{fill:#F3F6FA}.navy{fill:#15284D}.blue{fill:#3D6BFF}.teal{fill:#E6F6F6;stroke:#AEDDDD;stroke-width:1.6}.tealfill{fill:#2E9CA0}.rose{fill:#FAEEF2;stroke:#E7CBD4;stroke-width:1.5}.line{fill:none;stroke:#9EACC1;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.darkline{fill:none;stroke:#15284D;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#3D6BFF;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}.label{font:700 20px Inter,Arial,sans-serif;fill:#182B4B}.small{font:600 12px Inter,Arial,sans-serif;fill:#566985;letter-spacing:.05em}.step{font:700 15px Inter,Arial,sans-serif;fill:#23446E}.white{fill:#fff}.muted{fill:#9AA8BC}.softline{fill:none;stroke:#CFD7E5;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.metric{font:700 16px Inter,Arial,sans-serif;fill:#24466E}</style>
<rect class="bg" width="1200" height="360" rx="26"/>
<!-- Step 1 -->
<g transform="translate(45 40)">
  <rect width="250" height="280" rx="24" class="panel"/>
  <circle cx="30" cy="30" r="17" class="soft"/><text x="30" y="36" text-anchor="middle" class="step">1</text>
  <text x="58" y="37" class="label">PACS / MRI</text>
  <g transform="translate(28 82)">
    <!-- scanner -->
    <rect x="0" y="34" width="74" height="72" rx="14" class="soft"/>
    <circle cx="36" cy="70" r="20" class="softline"/>
    <rect x="64" y="55" width="66" height="28" rx="10" class="teal"/>
    <rect x="118" y="16" width="86" height="112" rx="16" class="navy"/>
    <path d="M161 37c-20 0-34 16-34 36 0 25 15 41 34 41 19 0 34-15 34-40 0-21-14-37-34-37Z" stroke="#F7FAFF" stroke-width="3" fill="none"/>
    <circle cx="178" cy="75" r="7" class="blue"/>
    <path d="M146 45c9-8 22-8 31-2" class="softline" stroke="#F7FAFF"/>
  </g>
  <text x="28" y="244" class="small">Clinical imaging input</text>
</g>
<path d="M300 180h45" class="arrow"/><path d="m334 170 16 10-16 10" class="arrow"/>
<!-- Step 2 -->
<g transform="translate(355 40)">
  <rect width="250" height="280" rx="24" class="panel"/>
  <circle cx="30" cy="30" r="17" class="soft"/><text x="30" y="36" text-anchor="middle" class="step">2</text>
  <text x="58" y="37" class="label">AI lesion review</text>
  <g transform="translate(26 82)">
    <rect x="0" y="8" width="134" height="124" rx="18" class="navy"/>
    <path d="M67 26c-27 0-46 20-46 45 0 32 19 52 46 52 25 0 45-19 45-51 0-27-18-46-45-46Z" stroke="#F7FAFF" stroke-width="3" fill="none"/>
    <circle cx="84" cy="66" r="10" class="blue"/>
    <circle cx="50" cy="84" r="7" class="tealfill"/>
    <path d="M84 53v26M71 66h26" class="arrow"/>
    <!-- AI chip -->
    <rect x="150" y="31" width="50" height="50" rx="12" class="teal"/>
    <path d="M160 22v10M176 22v10M192 22v10M160 81v10M176 81v10M192 81v10M141 42h10M141 58h10M141 74h10M200 42h10M200 58h10M200 74h10" class="line"/>
    <circle cx="175" cy="56" r="10" class="blue"/>
  </g>
  <text x="28" y="244" class="small">Candidate contours + AI outputs</text>
</g>
<path d="M610 180h45" class="arrow"/><path d="m644 170 16 10-16 10" class="arrow"/>
<!-- Step 3 -->
<g transform="translate(665 40)">
  <rect width="250" height="280" rx="24" class="panel"/>
  <circle cx="30" cy="30" r="17" class="soft"/><text x="30" y="36" text-anchor="middle" class="step">3</text>
  <text x="58" y="37" class="label">Structured report</text>
  <g transform="translate(34 78)">
    <rect width="182" height="146" rx="18" class="soft"/>
    <rect x="18" y="18" width="58" height="58" rx="12" class="navy"/>
    <circle cx="47" cy="47" r="16" stroke="#F7FAFF" stroke-width="2.5" fill="none"/>
    <circle cx="56" cy="44" r="5" class="blue"/>
    <path d="M96 29h56M96 48h43M96 67h50" class="darkline"/>
    <rect x="18" y="93" width="48" height="28" rx="9" class="teal"/><rect x="73" y="93" width="48" height="28" rx="9" class="rose"/><rect x="128" y="93" width="36" height="28" rx="9" class="soft"/>
    <path d="M29 107h26M84 107h26M137 107h18" class="line"/>
  </g>
  <text x="28" y="244" class="small">Lesion-level evidence for review</text>
</g>
<path d="M920 180h45" class="arrow"/><path d="m954 170 16 10-16 10" class="arrow"/>
<!-- Step 4 -->
<g transform="translate(975 40)">
  <rect width="180" height="280" rx="24" class="panel"/>
  <circle cx="30" cy="30" r="17" class="soft"/><text x="30" y="36" text-anchor="middle" class="step">4</text>
  <text x="58" y="37" class="label">Physician review</text>
  <g transform="translate(18 78)">
    <rect x="0" y="12" width="98" height="78" rx="14" class="soft"/>
    <rect x="10" y="22" width="78" height="52" rx="10" class="navy"/>
    <path d="M49 29c-17 0-28 12-28 27 0 18 11 30 28 30 16 0 28-11 28-29 0-16-11-28-28-28Z" stroke="#F7FAFF" stroke-width="2.4" fill="none"/>
    <circle cx="60" cy="53" r="5" class="blue"/>
    <circle cx="122" cy="40" r="19" class="teal"/>
    <circle cx="122" cy="39" r="9" class="darkline"/>
    <path d="M98 105c4-34 12-49 24-49s20 15 24 49" class="darkline"/>
    <path d="m108 119 11 11 22-22" class="arrow"/>
  </g>
  <text x="20" y="244" class="small">Confirm · modify · interpret</text>
</g>
</svg>