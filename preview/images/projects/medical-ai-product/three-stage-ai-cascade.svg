<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Three-stage lesion-wise AI cascade</title><desc id="desc">Candidate generation, false-positive reduction, and retained-lesion tumor typing.</desc>
<defs><style>.t{font-family:Inter,Arial,sans-serif;fill:#0B0F19}.m{fill:#667085}.b{fill:#1746E0}.n{fill:#071A46}.line{stroke:#DDE4F0;stroke-width:2}.box{fill:#fff;stroke:#DDE4F0;stroke-width:2}.icon{fill:none;stroke:#1746E0;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.h{font-size:46px;font-weight:600}.sub{font-size:22px}.st{font-size:23px;font-weight:600}.ss{font-size:16px}.num{font-size:20px;font-weight:700;fill:#fff}</style></defs>
<rect width="1600" height="820" rx="38" fill="#FCFCFB"/>
<text class="t h" x="90" y="105">Three-Stage Lesion-Wise AI Cascade</text><text class="m sub" x="90" y="145">Sensitivity-first proposal generation → false-positive reduction → retained-lesion tumor typing</text><line class="line" x1="90" y1="185" x2="1510" y2="185"/>
<g transform="translate(90,235)">
<path d="M430 165H505M935 165H1010" stroke="#8CA7E8" stroke-width="4"/><path d="m500 157 16 8-16 8M1005 157l16 8-16 8" fill="#1746E0"/>
<g><rect class="box" width="430" height="340" rx="24"/><circle class="b" cx="42" cy="42" r="24"/><text class="num" x="36" y="49">0</text><text class="t st" x="82" y="49">High-Sensitivity Candidate Generation</text><g class="icon" transform="translate(85,105)"><rect x="0" y="0" width="92" height="92" rx="15"/><path d="M22 46h48M46 22v48"/><circle cx="46" cy="46" r="19"/></g><path d="M205 150h85" class="line"/><path d="m285 144 12 6-12 6" fill="#1746E0"/><g class="icon" transform="translate(305,105)"><path d="M10 75V25l40-20 40 20v50L50 95 10 75Z"/><path d="M10 25l40 20 40-20M50 45v50"/></g><text class="t ss" x="85" y="235">T1C + T2 MRI</text><text class="t ss" x="305" y="235">3D nnU-Net v2</text><text class="m ss" x="85" y="275">Broad candidate pool</text><text class="m ss" x="85" y="300">Sensitivity prioritized</text></g>
<g transform="translate(505,0)"><rect class="box" width="430" height="340" rx="24"/><circle class="b" cx="42" cy="42" r="24"/><text class="num" x="36" y="49">1</text><text class="t st" x="82" y="49">False-Positive Reduction</text><g transform="translate(80,100)"><rect x="0" y="18" width="135" height="83" rx="14" fill="#F6F8FB" stroke="#DDE4F0" stroke-width="2"/><rect x="15" y="8" width="135" height="83" rx="14" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><rect x="30" y="0" width="135" height="83" rx="14" fill="#F3F6FF" stroke="#B7C8F2" stroke-width="2"/><circle cx="98" cy="42" r="16" fill="#D8E5FF"/><path d="M230 20h95l-28 42v44l-39 20V62l-28-42Z" fill="none" stroke="#1746E0" stroke-width="4"/><circle cx="350" cy="45" r="18" fill="#EAF8F0"/><path d="m342 45 6 6 12-14" fill="none" stroke="#27986B" stroke-width="4"/><circle cx="350" cy="97" r="18" fill="#FFF0F0"/><path d="m342 89 16 16M358 89l-16 16" fill="none" stroke="#D14B4B" stroke-width="4"/></g><text class="m ss" x="80" y="260">Candidate-centered 2.5D patches</text><text class="m ss" x="80" y="286">Obvious FP candidates removed</text></g>
<g transform="translate(1010,0)"><rect x="0" y="0" width="430" height="340" rx="24" fill="#F8FAFF" stroke="#B7C8F2" stroke-width="2"/><circle class="n" cx="42" cy="42" r="24"/><text class="num" x="36" y="49">2</text><text class="t st" x="82" y="49">Final Lesion Classification</text><g class="icon" transform="translate(75,105)"><path d="M5 80h55V25H5zM75 80h55V10H75zM145 80h55V40h-55z"/></g><g transform="translate(255,97)"><circle cx="30" cy="20" r="11" fill="#1746E0"/><circle cx="30" cy="60" r="11" fill="#1746E0"/><circle cx="30" cy="100" r="11" fill="#1746E0"/><circle cx="30" cy="140" r="11" fill="#1746E0"/><circle cx="30" cy="180" r="11" fill="#1746E0"/><text class="t ss" x="52" y="26">Neuroma</text><text class="t ss" x="52" y="66">Meningioma</text><text class="t ss" x="52" y="106">Metastasis</text><text class="t ss" x="52" y="146">Glioma</text><text class="t ss" x="52" y="186">Pituitary adenoma</text></g></g>
</g>
<g transform="translate(90,625)"><rect width="1420" height="112" rx="22" fill="#F6F8FB"/><text class="m ss" x="35" y="42">FINAL THESIS EVALUATION</text><text class="t st" x="35" y="78">12,125 development MRI exams</text><text class="t st" x="430" y="78">264 independent test exams</text><text class="t st" x="820" y="78">80.97% sensitivity</text><text class="t st" x="1110" y="78">0.21 FP/scan</text><text class="b st" x="1330" y="78" text-anchor="end">90.16% 5-class accuracy</text></g>
