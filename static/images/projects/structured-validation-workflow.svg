    <rect x="256" width="236" height="42" rx="16" class="soft"/><text x="374" y="27" text-anchor="middle" class="mini">10+ regulatory reports</text>
    <rect x="512" width="236" height="42" rx="16" class="soft"/><text x="630" y="27" text-anchor="middle" class="mini">2 labs adopted tooling</text>
