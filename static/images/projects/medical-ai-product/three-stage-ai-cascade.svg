<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Three-stage lesion-wise AI cascade</title><desc id="desc">Sensitivity-first candidate generation, false-positive reduction, and retained-lesion tumor typing with independent-test evidence.</desc>
<defs><style>.t{font-family:Inter,Arial,sans-serif;fill:#0B0F19}.m{font-family:Inter,Arial,sans-serif;fill:#667085}.b{fill:#1746E0}.line{stroke:#DDE4F0;stroke-width:2}.icon{fill:none;stroke:#1746E0;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.label{font-size:15px;font-weight:700;letter-spacing:2.2px}.h{font-size:25px;font-weight:600}.s{font-size:15px}.num{font-size:17px;font-weight:700}</style></defs>
<rect width="1600" height="620" rx="34" fill="#FCFCFB"/>
<text x="70" y="62" class="b label">LESION-WISE AI CASCADE · FINAL THESIS EVALUATION</text><line x1="70" y1="88" x2="1530" y2="88" class="line"/>
<g transform="translate(70,132)">
 <path d="M425 145H505M935 145H1015" stroke="#86A3E8" stroke-width="3" fill="none"/><path d="M500 139l12 6-12 6M1010 139l12 6-12 6" fill="#1746E0"/>
 <g><rect width="425" height="300" rx="24" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#EEF3FF"/><text x="36" y="48" class="b num">0</text><text x="80" y="49" class="t h">Candidate Generation</text><g class="icon" transform="translate(76,92)"><circle cx="46" cy="46" r="37"/><path d="M46 9v16M46 67v16M9 46h16M67 46h16"/></g><text x="190" y="126" class="t s">T1C + T2 MRI</text><text x="190" y="154" class="m s">3D nnU-Net v2</text><text x="190" y="183" class="m s">Sensitivity-first proposal pool</text><text x="76" y="260" class="m s">Goal: avoid missed lesions at the proposal stage.</text></g>
 <g transform="translate(505,0)"><rect width="430" height="300" rx="24" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#EEF3FF"/><text x="36" y="48" class="b num">1</text><text x="80" y="49" class="t h">False-Positive Reduction</text><g transform="translate(76,95)"><rect x="0" y="20" width="135" height="78" rx="14" fill="#F6F8FB" stroke="#DDE4F0" stroke-width="2"/><rect x="14" y="10" width="135" height="78" rx="14" fill="#fff" stroke="#DDE4F0" stroke-width="2"/><rect x="28" width="135" height="78" rx="14" fill="#F3F6FF" stroke="#B7C8F2" stroke-width="2"/><circle cx="95" cy="39" r="15" fill="#D8E5FF"/><path d="M230 10h102l-30 44v42l-42 20V54l-30-44Z" class="icon"/><circle cx="365" cy="39" r="17" fill="#EAF8F0"/><path d="m357 39 6 6 12-14" fill="none" stroke="#27986B" stroke-width="4"/></g><text x="76" y="260" class="m s">Lesion-centered filtering removes obvious non-tumor candidates.</text></g>
 <g transform="translate(1015,0)"><rect width="425" height="300" rx="24" fill="#F5F8FF" stroke="#B7C8F2" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#081221"/><text x="36" y="48" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#fff">2</text><text x="80" y="49" class="t h">Tumor Typing</text><g class="icon" transform="translate(75,95)"><path d="M0 90h45V36H0zM60 90h45V10H60zM120 90h45V50h-45z"/></g><g transform="translate(275,90)"><circle cx="14" cy="12" r="8" fill="#1746E0"/><circle cx="14" cy="47" r="8" fill="#1746E0"/><circle cx="14" cy="82" r="8" fill="#1746E0"/><circle cx="14" cy="117" r="8" fill="#1746E0"/><circle cx="14" cy="152" r="8" fill="#1746E0"/><text x="32" y="17" class="t s">Neuroma</text><text x="32" y="52" class="t s">Meningioma</text><text x="32" y="87" class="t s">Metastasis</text><text x="32" y="122" class="t s">Glioma</text><text x="32" y="157" class="t s">Pituitary</text></g><text x="75" y="260" class="m s">Residual FP modeling + five-class retained-lesion typing.</text></g>
</g>
<g transform="translate(70,485)"><rect width="1460" height="88" rx="20" fill="#F6F8FB"/><g transform="translate(35,18)"><text class="b label" x="0" y="18">COHORT</text><text class="t h" x="0" y="52">12,125</text><text class="m s" x="98" y="52">development MRI exams</text><line x1="350" y1="0" x2="350" y2="54" class="line"/><text class="t h" x="390" y="52">264</text><text class="m s" x="455" y="52">independent test exams</text><line x1="760" y1="0" x2="760" y2="54" class="line"/><text class="t h" x="800" y="52">80.97%</text><text class="m s" x="910" y="52">sensitivity</text><line x1="1070" y1="0" x2="1070" y2="54" class="line"/><text class="t h" x="1110" y="52">0.21</text><text class="m s" x="1175" y="52">FP / scan</text></g></g>
</svg>
