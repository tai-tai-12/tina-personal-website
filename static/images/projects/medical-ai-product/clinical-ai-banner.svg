<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Lesion-wise clinical AI pipeline</title><desc id="d">MRI input, candidate generation, false-positive filtering, and tumor typing.</desc><style>
